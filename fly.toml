# Fly.io config for the continuous ingest worker.
# It has NO public services / ports — it's a background worker that loops over
# "due" brands (pending/failed + active brands overdue for weekly refresh) and
# fills in ads. Secrets (DATABASE_URL, FACEBOOK_ACCESS_TOKEN*) are set with
# `fly secrets set`, never committed here.
app = "greatearth-ingest-worker"
primary_region = "arn"  # Stockholm — close to the Nordic focus / EU Neon region

[build]
  dockerfile = "Dockerfile.worker"

# Single background process. This command overrides the Dockerfile CMD.
[processes]
  worker = "npm run worker"

# Worker tuning. CONCURRENCY matched to token count (3) so each token drives one
# parallel stream; raise both together as more tokens are added. MAX_ADS_PER_BRAND
# lifts the old 2000 truncation so mega-advertisers are fully captured.
[env]
  CONCURRENCY = "3"
  PACE_MS = "2000"
  BATCH = "24"
  POLL_MS = "60000"
  MAX_ADS_PER_BRAND = "10000"
  # Pause ingestion while the shared Meta app quota is exhausted, to stop burning
  # calls on requests that can only come back 613. Measured 2026-09-15: the last
  # productive hour was 04:00 UTC (47 jobs, 0 failures), 05:00 was already half
  # failures, 06:00–13:00 was 326 jobs and 0 ads, and the first hour back after the
  # old 13–17 window (17:00) immediately produced 1,144 ads. Widened from 13 to 5.
  # One day of evidence — re-check the hourly job table before narrowing it again.
  BACKOFF_START_UTC = "5"
  BACKOFF_END_UTC = "17"
  # Asset drain. Meta refuses render_ad under sustained load and the refusal looks
  # identical to a missing ad, so pace it: concurrency 2 with 3s between batches held
  # 99% success in testing, while unpaced concurrency 5 collapsed to 0% after ~10k.
  # TEMPORARILY OFF (2026-09-20). ASSET_BATCH=0 makes drainAssets() a no-op.
  #
  # The ordering bug in processPendingAssets meant this worker spent four days
  # retrying ads Meta had already expired, ~15,750 render_ad requests that could never
  # succeed. That looks to have earned this IP a throttle: after the ordering fix the
  # same code stores 84 of 900 here (9%) against 14 of 15 (93%) from a residential
  # connection on the same kind of fresh rows. Nine percent at one batch per ~20min is
  # about nine assets an hour, which is not worth the render_ad budget.
  #
  # So: let the throttle decay with the drain off, work the fresh backlog from
  # scripts/drain-assets.ts elsewhere, and turn this back on with harder pacing than 50
  # per batch. Re-measure before restoring — if the first batch back is not near 90%,
  # the IP is still hot.
  ASSET_BATCH = "0"
  ASSET_CONCURRENCY = "2"
  ASSET_PACE_MS = "3000"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"  # Chromium for asset extraction + ingestion + the nightly BigQuery sync
  processes = ["worker"]
